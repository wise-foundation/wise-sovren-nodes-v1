[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
script = "script"
cache_path = "cache"
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 600000
# Keep evm_version = cancun explicit so a newer compiler default (osaka) never
# emits opcodes unsupported on a deploy chain.
evm_version = "cancun"
extra_output = ["storageLayout"]
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read-write", path = "./config" }
]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_KEY}", chain = 11155111 }
